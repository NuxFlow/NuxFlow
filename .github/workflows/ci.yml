name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  commitlint:
    name: Commit messages
    # PR-commit-range linting only makes sense for pull_request events (the action reads
    # the PR's commit list via the GitHub API); the changeset-release PR's own commits
    # ("chore: version packages" etc., authored by the changesets bot) are exempted the
    # same way every other job here already exempts that branch.
    if: github.event_name == 'pull_request' && github.head_ref != 'changeset-release/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: wagoid/commitlint-github-action@b948419dd99f3fd78a6548d48f94e3df7f6bf3ed # v6.2.1
        with:
          configFile: commitlint.config.ts

  typecheck:
    name: Type check
    if: github.head_ref != 'changeset-release/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  lint:
    name: Lint
    if: github.head_ref != 'changeset-release/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  test:
    name: Unit tests
    if: github.head_ref != 'changeset-release/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @nuxflow/app exec nuxt prepare
        env:
          NUXT_BETTER_AUTH_SECRET: ci-placeholder-secret-32-characters
          NUXT_PUBLIC_SITE_URL: https://example.com
      - run: pnpm test

  test-integration:
    name: Integration tests
    if: github.head_ref != 'changeset-release/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @nuxflow/app exec nuxt prepare
        env:
          NUXT_BETTER_AUTH_SECRET: ci-placeholder-secret-32-characters
          NUXT_PUBLIC_SITE_URL: https://example.com
      - run: pnpm test:integration

  node-floor:
    name: Node engines floor (22.22)
    # package.json declares "node": ">=22.22.0" (Nitro v3's floor, ahead of Nuxt 5) but
    # every other job here runs on 24 — this is the only one that actually exercises the
    # documented minimum. Scoped to typecheck/lint/unit (not integration/E2E/build) to
    # catch a real floor incompatibility without doubling CI's total runtime for every push.
    if: github.head_ref != 'changeset-release/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @nuxflow/app exec nuxt prepare
        env:
          NUXT_BETTER_AUTH_SECRET: ci-placeholder-secret-32-characters
          NUXT_PUBLIC_SITE_URL: https://example.com
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test

  test-e2e:
    name: E2E tests
    if: github.head_ref != 'changeset-release/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @nuxflow/app exec playwright install --with-deps chromium
      # apps/nuxflow/wrangler.toml is gitignored (holds real per-developer resource
      # ids) — `pnpm dev` (== `wrangler dev`) needs one to exist at all, and local-mode
      # `wrangler dev` doesn't validate D1/KV/worker_loaders ids against a real
      # Cloudflare account, so the committed template's placeholder ids are sufficient.
      - run: cp wrangler.toml.example wrangler.toml
        working-directory: apps/nuxflow
      - run: pnpm --filter @nuxflow/app test:e2e
        env:
          NUXT_BETTER_AUTH_SECRET: e2e-test-secret-exactly-32-chars!
          NUXT_PUBLIC_SITE_URL: https://example.com
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: apps/nuxflow/playwright-report/
          retention-days: 7

  nuxt5-preview:
    name: Nuxt 5 preview (informational)
    # Builds and type-checks with Nuxt 5's defaults on (NUXFLOW_NUXT5_PREVIEW, see
    # nuxt.config.ts) to show what the upgrade still needs. Allowed to fail: it never
    # blocks a merge. Known today: typed $fetch rejects the `: string` URL workaround for
    # non-GET calls (CLAUDE.md's $fetch typing notes) — that goes on upgrade day.
    if: github.head_ref != 'changeset-release/main'
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      NUXFLOW_NUXT5_PREVIEW: '1'
      NUXT_BETTER_AUTH_SECRET: ci-placeholder-secret-32-characters
      NUXT_PUBLIC_SITE_URL: https://example.com
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck

  build:
    name: Build
    if: github.head_ref != 'changeset-release/main'
    runs-on: ubuntu-latest
    needs: [typecheck, lint, test, test-integration]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        env:
          NUXT_BETTER_AUTH_SECRET: ci-placeholder-secret-32-characters
          NUXT_PUBLIC_SITE_URL: https://example.com
          NODE_OPTIONS: --max-old-space-size=4096
