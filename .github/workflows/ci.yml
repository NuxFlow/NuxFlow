name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  commitlint:
    name: Commit messages
    # PR-commit-range linting only makes sense for pull_request events (the action reads
    # the PR's commit list via the GitHub API); the changeset-release PR's own commits
    # ("chore: version packages" etc., authored by the changesets bot) are exempted the
    # same way every other job here already exempts that branch.
    if: github.event_name == 'pull_request' && github.head_ref != 'changeset-release/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
      - uses: wagoid/commitlint-github-action@v6
        with:
          configFile: commitlint.config.ts

  typecheck:
    name: Type check
    if: github.head_ref != 'changeset-release/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  lint:
    name: Lint
    if: github.head_ref != 'changeset-release/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  test:
    name: Unit tests
    if: github.head_ref != 'changeset-release/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @nuxflow/app exec nuxt prepare
        env:
          NUXT_BETTER_AUTH_SECRET: ci-placeholder-secret-32-characters
          NUXT_PUBLIC_SITE_URL: https://example.com
      - run: pnpm test

  test-integration:
    name: Integration tests
    if: github.head_ref != 'changeset-release/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @nuxflow/app exec nuxt prepare
        env:
          NUXT_BETTER_AUTH_SECRET: ci-placeholder-secret-32-characters
          NUXT_PUBLIC_SITE_URL: https://example.com
      - run: pnpm test:integration

  build:
    name: Build
    if: github.head_ref != 'changeset-release/main'
    runs-on: ubuntu-latest
    needs: [typecheck, lint, test, test-integration]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        env:
          NUXT_BETTER_AUTH_SECRET: ci-placeholder-secret-32-characters
          NUXT_PUBLIC_SITE_URL: https://example.com
          NODE_OPTIONS: --max-old-space-size=4096
