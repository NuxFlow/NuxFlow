name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  commitlint:
    name: Commit messages
    # PR-commit-range linting only makes sense for pull_request events (the action reads
    # the PR's commit list via the GitHub API); the changeset-release PR's own commits
    # ("chore: version packages" etc., authored by the changesets bot) are exempted the
    # same way every other job here already exempts that branch.
    if: github.event_name == 'pull_request' && github.head_ref != 'changeset-release/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
      - uses: wagoid/commitlint-github-action@v6
        with:
          configFile: commitlint.config.ts

  typecheck:
    name: Type check
    if: github.head_ref != 'changeset-release/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  lint:
    name: Lint
    if: github.head_ref != 'changeset-release/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  test:
    name: Unit tests
    if: github.head_ref != 'changeset-release/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @nuxflow/app exec nuxt prepare
        env:
          NUXT_BETTER_AUTH_SECRET: ci-placeholder-secret-32-characters
          NUXT_PUBLIC_SITE_URL: https://example.com
      - run: pnpm test

  test-integration:
    name: Integration tests
    if: github.head_ref != 'changeset-release/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @nuxflow/app exec nuxt prepare
        env:
          NUXT_BETTER_AUTH_SECRET: ci-placeholder-secret-32-characters
          NUXT_PUBLIC_SITE_URL: https://example.com
      - run: pnpm test:integration

  node-floor:
    name: Node engines floor (22)
    # package.json declares "node": ">=22.0.0" but every other job here runs on 24 —
    # this is the only one that actually exercises the documented minimum. Scoped to
    # typecheck/lint/unit (not integration/E2E/build) to catch a real floor
    # incompatibility without doubling CI's total runtime for every push.
    if: github.head_ref != 'changeset-release/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @nuxflow/app exec nuxt prepare
        env:
          NUXT_BETTER_AUTH_SECRET: ci-placeholder-secret-32-characters
          NUXT_PUBLIC_SITE_URL: https://example.com
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test

  test-e2e:
    name: E2E tests
    if: github.head_ref != 'changeset-release/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @nuxflow/app exec playwright install --with-deps chromium
      # apps/nuxflow/wrangler.toml is gitignored (holds real per-developer resource
      # ids) — `pnpm dev` (== `wrangler dev`) needs one to exist at all, and local-mode
      # `wrangler dev` doesn't validate D1/KV/worker_loaders ids against a real
      # Cloudflare account, so the committed template's placeholder ids are sufficient.
      - run: cp wrangler.toml.example wrangler.toml
        working-directory: apps/nuxflow
      - run: pnpm --filter @nuxflow/app test:e2e
        env:
          NUXT_BETTER_AUTH_SECRET: e2e-test-secret-exactly-32-chars!
          NUXT_PUBLIC_SITE_URL: https://example.com
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/nuxflow/playwright-report/
          retention-days: 7

  build:
    name: Build
    if: github.head_ref != 'changeset-release/main'
    runs-on: ubuntu-latest
    needs: [typecheck, lint, test, test-integration]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        env:
          NUXT_BETTER_AUTH_SECRET: ci-placeholder-secret-32-characters
          NUXT_PUBLIC_SITE_URL: https://example.com
          NODE_OPTIONS: --max-old-space-size=4096
